---
- hosts: all
  vars:
    # Keep package availability exceptions named so distro support changes stay centralized.
    rose_common_supported_distros:
      - humble
      - galactic
      - jazzy
      - rolling
    rose_common_modern_distros:
      - humble
      - jazzy
      - rolling
    rose_common_plansys2_distros:
      - humble
      - galactic
      - rolling
  pre_tasks:
    - name: Resolve ROSE context
      import_tasks: ../tasks/resolve_rose_context.yaml
      vars:
        rose_require_ros_distro: true
  tasks:
    - name: Update apt cache
      become: "{{ rose_use_become }}"
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install ROSE common ROS 2 packages
      become: "{{ rose_use_become }}"
      block:
        - name: Install RMW packages
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-rmw-cyclonedds-cpp
        - name: Install Zenoh RMW packages
          when: rose_effective_ros_distro in rose_common_modern_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-rmw-zenoh-cpp
        - name: Install rcl packages
          when: rose_effective_ros_distro in rose_common_supported_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-rcl-interfaces
              - ros-{{ rose_effective_ros_distro }}-rclc
              - ros-{{ rose_effective_ros_distro }}-rclc-parameter
              - ros-{{ rose_effective_ros_distro }}-rclc-lifecycle
              - ros-{{ rose_effective_ros_distro }}-rclcpp
              - ros-{{ rose_effective_ros_distro }}-rclpy
        - name: Install message packages
          when: rose_effective_ros_distro in rose_common_supported_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-std-msgs
              - ros-{{ rose_effective_ros_distro }}-sensor-msgs
              - ros-{{ rose_effective_ros_distro }}-geometry-msgs
              - ros-{{ rose_effective_ros_distro }}-control-msgs
              - ros-{{ rose_effective_ros_distro }}-nav-msgs
              - ros-{{ rose_effective_ros_distro }}-map-msgs
              - ros-{{ rose_effective_ros_distro }}-moveit-msgs
              - ros-{{ rose_effective_ros_distro }}-diagnostic-msgs
              - ros-{{ rose_effective_ros_distro }}-can-msgs
              - ros-{{ rose_effective_ros_distro }}-vision-msgs
              - ros-{{ rose_effective_ros_distro }}-graph-msgs
              - ros-{{ rose_effective_ros_distro }}-micro-ros-msgs
        - name: Install modern message packages
          when: rose_effective_ros_distro in rose_common_modern_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-actuator-msgs
              - ros-{{ rose_effective_ros_distro }}-gps-msgs
              - ros-{{ rose_effective_ros_distro }}-plotjuggler-msgs
        - name: Install micro-ROS diagnostic message packages
          when: rose_effective_ros_distro in rose_common_modern_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-micro-ros-diagnostic-msgs
        - name: Install ros2-control packages
          when: rose_effective_ros_distro in rose_common_supported_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-ros2-control
              - ros-{{ rose_effective_ros_distro }}-ros2-controllers
        - name: Install nav2 packages
          when: rose_effective_ros_distro in rose_common_supported_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-nav2-amcl
              - ros-{{ rose_effective_ros_distro }}-nav2-bt-navigator
              - ros-{{ rose_effective_ros_distro }}-nav2-behaviors
              - ros-{{ rose_effective_ros_distro }}-nav2-controller
              - ros-{{ rose_effective_ros_distro }}-nav2-planner
              - ros-{{ rose_effective_ros_distro }}-nav2-map-server
              - ros-{{ rose_effective_ros_distro }}-nav2-costmap-2d
        - name: Install moveit2 packages
          when: rose_effective_ros_distro in rose_common_supported_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-moveit-servo
              - ros-{{ rose_effective_ros_distro }}-moveit-ros-planning
              - ros-{{ rose_effective_ros_distro }}-moveit-ros-control-interface
        - name: Install plansys2 packages
          when: rose_effective_ros_distro in rose_common_plansys2_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-plansys2-msgs
              - ros-{{ rose_effective_ros_distro }}-plansys2-bringup
        - name: Install grid_map package
          when: rose_effective_ros_distro in rose_common_supported_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-grid-map-msgs
              - ros-{{ rose_effective_ros_distro }}-grid-map-core
              - ros-{{ rose_effective_ros_distro }}-grid-map-filters
              - ros-{{ rose_effective_ros_distro }}-grid-map-loader
              - ros-{{ rose_effective_ros_distro }}-grid-map-pcl
              - ros-{{ rose_effective_ros_distro }}-grid-map-octomap
              - ros-{{ rose_effective_ros_distro }}-grid-map-sdf
        - name: Install image transport packages
          when: rose_effective_ros_distro in rose_common_supported_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-image-transport
              - ros-{{ rose_effective_ros_distro }}-image-transport-plugins
        - name: Install modern image transport packages
          when: rose_effective_ros_distro in rose_common_modern_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-ffmpeg-image-transport
        - name: Install point cloud transport packages
          when: rose_effective_ros_distro in rose_common_modern_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-point-cloud-transport
              - ros-{{ rose_effective_ros_distro }}-point-cloud-transport-plugins
        - name: Install perception packages
          when: rose_effective_ros_distro in rose_common_supported_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-image-proc
              - ros-{{ rose_effective_ros_distro }}-stereo-image-proc
              - ros-{{ rose_effective_ros_distro }}-depthimage-to-laserscan
              - ros-{{ rose_effective_ros_distro }}-depth-image-proc
              - ros-{{ rose_effective_ros_distro }}-pcl-ros
              - ros-{{ rose_effective_ros_distro }}-cv-bridge
        - name: Install modern perception packages
          when: rose_effective_ros_distro in rose_common_modern_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-apriltag-ros
              - ros-{{ rose_effective_ros_distro }}-apriltag
              - ros-{{ rose_effective_ros_distro }}-apriltag-detector
              - ros-{{ rose_effective_ros_distro }}-zbar-ros
        - name: Install IMU data processor packages
          when: rose_effective_ros_distro in rose_common_supported_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-imu-complementary-filter
              - ros-{{ rose_effective_ros_distro }}-imu-filter-madgwick
        - name: Install modern IMU data processor packages
          when: rose_effective_ros_distro in rose_common_modern_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-imu-pipeline
              - ros-{{ rose_effective_ros_distro }}-imu-processors
              - ros-{{ rose_effective_ros_distro }}-imu-transformer
        - name: Install filter packages
          when: rose_effective_ros_distro in rose_common_supported_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-filters
              - ros-{{ rose_effective_ros_distro }}-laser-filters
              - ros-{{ rose_effective_ros_distro }}-robot-localization
        - name: Install ROS 2 driver packages
          when: rose_effective_ros_distro in rose_common_supported_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-ros2-socketcan
              - ros-{{ rose_effective_ros_distro }}-joy
              - ros-{{ rose_effective_ros_distro }}-ublox
              - ros-{{ rose_effective_ros_distro }}-ublox-gps
              - ros-{{ rose_effective_ros_distro }}-realsense2-camera
              - ros-{{ rose_effective_ros_distro }}-velodyne
        - name: Install modern ROS 2 driver packages
          when: rose_effective_ros_distro in rose_common_modern_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-joy-linux
              - ros-{{ rose_effective_ros_distro }}-usb-cam
              - ros-{{ rose_effective_ros_distro }}-v4l2-camera
        - name: Install flexbe packages
          when: rose_effective_ros_distro in rose_common_supported_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-flexbe-msgs
              - ros-{{ rose_effective_ros_distro }}-flexbe-behavior-engine
              - ros-{{ rose_effective_ros_distro }}-flexbe-core
              - ros-{{ rose_effective_ros_distro }}-flexbe-input
              - ros-{{ rose_effective_ros_distro }}-flexbe-mirror
              - ros-{{ rose_effective_ros_distro }}-flexbe-onboard
              - ros-{{ rose_effective_ros_distro }}-flexbe-states
              - ros-{{ rose_effective_ros_distro }}-flexbe-widget
        - name: Install micro-ROS diagnostic bridge
          when: rose_effective_ros_distro in rose_common_modern_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-micro-ros-diagnostic-bridge
        - name: Install ROS 2 calibration packages from apt
          when: rose_effective_ros_distro in rose_common_modern_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-robot-calibration-msgs
              - ros-{{ rose_effective_ros_distro }}-robot-calibration
        - name: Install ROS 2 rtabmap packages from apt
          when: rose_effective_ros_distro in rose_common_supported_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-rtabmap-msgs
              - ros-{{ rose_effective_ros_distro }}-rtabmap-odom
              - ros-{{ rose_effective_ros_distro }}-rtabmap-slam
        - name: Install ROS 2 utils packages
          when: rose_effective_ros_distro in rose_common_supported_distros
          apt:
            install_recommends: false
            name:
              - ros-{{ rose_effective_ros_distro }}-diagnostics
              - ros-{{ rose_effective_ros_distro }}-xacro
              - ros-{{ rose_effective_ros_distro }}-domain-bridge
              - ros-{{ rose_effective_ros_distro }}-robot-state-publisher
              - ros-{{ rose_effective_ros_distro }}-joint-state-publisher
              - ros-{{ rose_effective_ros_distro }}-rosbag2-storage-mcap
              - ros-{{ rose_effective_ros_distro }}-joy-teleop
              - ros-{{ rose_effective_ros_distro }}-key-teleop
              - ros-{{ rose_effective_ros_distro }}-teleop-twist-joy
              - ros-{{ rose_effective_ros_distro }}-teleop-twist-keyboard
              - ros-{{ rose_effective_ros_distro }}-twist-mux
